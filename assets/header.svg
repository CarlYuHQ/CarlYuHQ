    <circle cx="847" cy="33" r="4" fill="#7761cf"><animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></circle>
    <text x="833" y="38" fill="#686178" font-size="12" text-anchor="end" letter-spacing="1.1">ALWAYS A WORK IN PROGRESS</text>
    <text x="37" y="141" fill="#242438" font-size="74" font-weight="750" letter-spacing="-4">Hi, I'm <tspan fill="#7761cf">Carl.</tspan></text>
    <path d="M286 154Q345 143 421 150" fill="none" stroke="#c9b9ef" stroke-width="6" stroke-linecap="round"/>
    <text x="40" y="194" fill="#48445c" font-size="21" font-weight="550">A curious mind. A hands-on builder.</text>
    <text x="40" y="230" fill="#686178" font-size="16">Peking University · AI / ML · Full-stack</text>
    <rect x="38" y="267" width="257" height="39" rx="19.5" fill="#eeebf5"/>
    <circle cx="60" cy="287" r="4" fill="#7761cf"/>
    <text x="74" y="292" fill="#5f4b98" font-size="14" font-weight="600">learn something. make something.</text>
  </g>
  <g transform="rotate(-5 698 174)">
