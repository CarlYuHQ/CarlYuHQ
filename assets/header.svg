    <circle cx="561" cy="102" r="4" fill="#e7a99b"/><circle cx="575" cy="102" r="4" fill="#e6cc8b"/><circle cx="589" cy="102" r="4" fill="#a9c9b9"/>
    <text x="621" y="107" fill="#777080" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="12">curiosity.py</text>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="17">
      <text x="563" y="158" fill="#7761cf">while <tspan fill="#242438">curious:</tspan></text>
      <text x="583" y="188" fill="#5b6487">learn<tspan fill="#242438">()</tspan></text>
      <text x="583" y="218" fill="#458775">build<tspan fill="#242438">()</tspan></text>
      <text x="583" y="248" fill="#bd765e">share<tspan fill="#242438">()</tspan></text>
      <rect x="669" y="234" width="8" height="18" rx="1" fill="#c5b4e7"><animate attributeName="opacity" values="1;1;0;0;1" dur="2s" repeatCount="indefinite"/></rect>
    </g>
