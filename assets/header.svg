<svg xmlns="http://www.w3.org/2000/svg" width="900" height="346" viewBox="0 0 900 346" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Carl. Welcome to my little corner of GitHub.</title>
  <desc id="desc">CarlYuHQ, Peking University. AI, machine learning, and full-stack development. A personal lab for learning, building, and sharing.</desc>
  <defs>
