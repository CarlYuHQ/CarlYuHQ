name: Update contribution activity

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: 检出默认分支
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: 配置 Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 验证官方数据并更新浅色与深色贡献图
        run: python -B .github/scripts/update_activity.py

      - name: 仅在图片变化时提交并推送默认分支
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/activity.svg assets/activity-dark.svg
          if git diff --cached --quiet -- assets/activity.svg assets/activity-dark.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update contribution activity' -- assets/activity.svg assets/activity-dark.svg
          git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
